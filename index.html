<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Alpha | Premium</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kalnia+Glaze:wght@100..700&family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">

    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<body>
    <div id="comet-transition"></div>

    <div id="youtube-players" style="display: none;">
        <iframe id="comet-effect" width="0" height="0" src="https://www.youtube.com/embed/or0pYLd8kxE?enablejsapi=1" frameborder="0"></iframe>
        <iframe id="video-music" width="0" height="0" src="https://www.youtube.com/embed/UDVtMYqUAyw?enablejsapi=1&loop=1&playlist=UDVtMYqUAyw" frameborder="0"></iframe>
    </div>

    <div id="canvas-container"></div>

    <div id="home-screen" class="screen active">
        <div class="glass-main">
            <h1 class="neon-title">Físico de Elite</h1>
            <p class="subtitle">Revisão Essencial para o Ensino Superior</p>

            <div class="main-content">
                <div class="card-3d-wrap" onmousemove="handleCard3D(event)" onmouseleave="resetCard3D()">
                    <div class="level-card" id="main-card" onclick="triggerComet('pre-calculo')">
                        <img src="img/walter_lewin.jfif" class="card-img-bg">
                        <div id="atom-canvas-container"></div> 
                        <div class="card-info">
                            <span class="badge">NÍVEL 01</span>
                            <h2>Funções & Trigonometria</h2>
                            <p>Clique para iniciar</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="formula-floating f-1">\(E = mc^2\)</div>
            <div class="formula-floating f-2">\(F = G \frac{m_1 m_2}{r^2}\)</div>
            <div class="formula-floating f-3">\(\nabla \cdot \mathbf{E} = \frac{\rho}{\epsilon_0}\)</div>
        </div>
    </div>

    <div id="module-screen" class="screen"></div>

    <script src="script.js"></script>
