<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics | Dashboard de </title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
</head>
<body>
    <div id="comet-transition"></div>
    <div id="canvas-container"></div>

    <div id="home-screen" class="screen active">
        <div class="glass-main">
            <h1 class="neon-title">Física </h1>
            <p class="subtitle">Revisão Médio → Superior</p>
            
            <div class="main-content">
                <div class="card-3d-wrap" onmousemove="handleCard3D(event)" onmouseleave="resetCard3D()">
                    <div class="level-card" id="main-card" onclick="triggerComet('module')">
                        <img src="img/walter_lewin.jfif" class="card-img-bg">
                        <div id="atom-canvas-container"></div> 
                        <div class="card-info">
                            <span class="badge">NÍVEL 01</span>
                            <h2>Dashboard de Estudo</h2>
                            <p>Clique para acessar as aulas e problemas</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="formula-footer">
                <div id="float-1" class="floating-math"></div>
                <div id="float-2" class="floating-math"></div>
            </div>
        </div>
    </div>

    <div id="module-screen" class="screen"></div>

    <script src="script.js"></script>
</body>
</html>
