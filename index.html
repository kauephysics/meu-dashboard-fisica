<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Alpha | Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">

    <div class="container">
        <header>
            <h1>PROJETO: <span class="highlight">FISICO DE ELITE</span></h1>
            <p>Contagem regressiva até 13 de Março: <span id="countdown">--d --h --m</span></p>
        </header>

        <section class="stats">
            <div class="card">
                <h3>Progresso Total</h3>
                <div class="progress-bar">
                    <div class="progress" id="main-progress" style="width: 0%"></div>
                </div>
            </div>
        </section>

        <main class="grid">
            <div class="subject-card" onclick="playSound()">
                <img src="https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=200" alt="Cálculo">
                <div class="info">
                    <h3>Cálculo Diferencial</h3>
                    <p>Limites e Derivadas</p>
                    <input type="checkbox" class="task" onchange="updateProgress()"> Concluído
                </div>
            </div>

            <div class="subject-card" onclick="playSound()">
                <img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=200" alt="Mecânica">
                <div class="info">
                    <h3>Mecânica Clássica</h3>
                    <p>Vetores e Leis de Newton</p>
                    <input type="checkbox" class="task" onchange="updateProgress()"> Concluído
                </div>
            </div>
        </main>
    </div>

    <audio id="click-sound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
