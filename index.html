<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Física Alfa | Painel Elite</title>
    <link rel="stylesheet" href="estilo.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="player" style="display:none"></div>
    <div id="canvas-container"></div>

    <div id="home-screen" class="screen active">
        <header class="main-header">
            <h1 class="neon-title">PROJETO: FÍSICO DE ELITE</h1>
            <div class="controls">
                <button id="music-control" class="btn-ui" onclick="toggleMusic()">
                    <span>🎵</span> Som: <span id="music-status">OFF</span>
                </button>
            </div>
        </header>

        <div class="level-selector">
            <div class="level-card" onclick="goToModule('pre-calculo')">
                <img src="imagem/walter_lewin.jpg.jfif" class="card-bg">
                <div class="card-info">
                    <span>NÍVEL 01</span>
                    <h2>Pré-Cálculo & Vetores</h2>
                </div>
            </div>

            <div class="level-card" onclick="goToModule('cinematica')">
                <img src="imagem/oppenheimer.jpg.jfif" class="card-bg">
                <div class="card-info">
                    <span>NÍVEL 02</span>
                    <h2>Cinemática (Cálculo)</h2>
                </div>
            </div>
        </div>
    </div>

    <div id="module-screen" class="screen">
        <button class="back-btn" onclick="goHome()">← VOLTAR AO HUB</button>
        <div id="module-content"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
