<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Físico de Elite | Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <audio id="bg-music" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <div id="canvas-container"></div>

    <div id="home-screen" class="screen active">
        <h1 class="neon-title">PROJETO: FÍSICO DE ELITE</h1>
        
        <div class="level-selector">
            <div class="level-card" onclick="goToModule('pre-calculo')">
                <img src="imagem/walter_lewin.jfif" class="card-bg">
                <div class="card-info">
                    <span>NÍVEL 01</span>
                    <h2>Pré-Cálculo & Vetores</h2>
                </div>
            </div>

            <div class="level-card" onclick="goToModule('cinematica')">
                <img src="imagem/oppenheimer.jfif" class="card-bg">
                <div class="card-info">
                    <span>NÍVEL 02</span>
                    <h2>Cinemática (Cálculo)</h2>
                </div>
            </div>
        </div>
    </div>

    <div id="module-screen" class="screen">
        <div class="module-layout">
            <button class="back-btn" onclick="goHome()">← VOLTAR AO HUB</button>
            <div id="module-content"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
