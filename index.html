<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Alpha | Premium</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kalnia+Glaze:wght@100..700&family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="comet-transition"></div>

    <div id="youtube-players" style="display: none;">
        <iframe id="comet-effect" width="0" height="0" src="https://www.youtube.com/embed/or0pYLd8kxE?enablejsapi=1" frameborder="0"></iframe>
        <iframe id="video-music" width="0" height="0" src="https://www.youtube.com/embed/UDVtMYqUAyw?enablejsapi=1&loop=1&playlist=UDVtMYqUAyw" frameborder="0"></iframe>
    </div>

    <div id="canvas-container"></div>

    <div id="home-screen" class="screen active">
        <div class="glass-container">
            <header class="glass-header">
                <div class="logo">O2<span>®</span></div>
                <nav>
                    <span>FÍSICA</span>
                    <span>CÁLCULO</span>
                    <span>VETORES</span>
                </nav>
                <div class="login-btn">Entrar</div>
            </header>

            <main class="glass-content">
                <div class="left-panel">
                    <h1 class="neon-title">Físico de<br>Elite</h1>
                    <p class="subtitle">Revisão Essencial Pré-Faculdade</p>
                    
                    <div class="card-3d-wrap" onmousemove="handleCard3D(event)" onmouseleave="resetCard3D()">
                        <div class="level-card" id="main-card" onclick="triggerComet('pre-calculo')">
                            <img src="img/walter_lewin.jfif" class="card-img-bg">
                            <div id="atom-canvas-container"></div> <div class="card-info">
                                <span class="badge">NÍVEL 01</span>
                                <h2>Funções & Trigonometria</h2>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="right-panel">
                    <div class="big-number">01</div>
                    <div class="theory-box">
                        <h3>Fundamentos</h3>
                        <p>Domine a matemática que descreve o universo antes de entrar no laboratório.</p>
                        <div class="formula-display">
                            <span>E = mc²</span>
                            <span>F = G (m₁m₂)/r²</span>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div id="module-screen" class="screen"></div>

    <script src="script.js"></script>
</body>
</html>
