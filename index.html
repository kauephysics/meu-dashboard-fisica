<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Alpha | Dashboard de Estudos</title>
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kalnia+Glaze:wght@100..700&family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="comet-transition"></div>

    <div id="canvas-container"></div>

    <div id="home-screen" class="screen active">
        <div class="glass-main">
            <h1 class="neon-title">Física</h1>
            <p class="subtitle">Revisão Essencial Médio → Superior</p>

            <div class="main-content">
                <div class="card-3d-wrap" onmousemove="handleCard3D(event)" onmouseleave="resetCard3D()">
                    <div class="level-card" id="main-card" onclick="triggerComet('module')">
                        <img src="img/walter_lewin.jfif" class="card-img-bg">
                        <div id="atom-canvas-container"></div> 
                        <div class="card-info">
                            <span class="badge">NÍVEL 01</span>
                            <h2>Funções & Trigonometria</h2>
                            <p>Toque para abrir o mapa de estudos</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="formula-floating f-1" id="float-1"></div>
            <div class="formula-floating f-2" id="float-2"></div>
        </div>
    </div>

    <div id="module-screen" class="screen"></div>

    <div style="display: none;">
        <iframe id="comet-effect" src="https://www.youtube.com/embed/or0pYLd8kxE?enablejsapi=1" frameborder="0"></iframe>
    </div>

    <script src="script.js"></script>
</body>
</html>
